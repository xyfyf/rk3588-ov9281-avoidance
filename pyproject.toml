[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omniavoid"
version = "0.2.1"
description = "Four fisheye stereo obstacle-distance research baseline for RK3588"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21,<3", "opencv-contrib-python-headless>=4.5.4,<5", "scipy>=1.8,<2", "pymavlink>=2.4.41,<3", "pyserial>=3.5,<4"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[project.scripts]
omniavoid = "omniavoid.cli:main"

[tool.setuptools.packages.find]
include = ["omniavoid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
